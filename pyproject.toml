[project]
name = "walla-cli"
version = "0.1.6"
description = "Wallapop.es CLI - look · offer · talk for humans and agents"
authors = [{ name = "Dr. Berend Gort", email = "berend.gort@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["wallapop", "cli", "mcp", "marketplace", "spain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "curl-cffi>=0.7.0",
    "pydantic>=2.10.0",
    "rich>=13.8.0",
    "tenacity>=9.0.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.2",
    "mcp>=1.2.0",
]
dev = [
    "build>=1.2.0",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]
all = [
    "walla-cli[mcp,dev]",
]

[project.scripts]
walla = "walla.cli.main:cli"
walla-mcp = "walla.mcp._entry:run"
walla-mcp-http = "walla.mcp._entry:run_http"

[project.urls]
Homepage = "https://github.com/berendgort/wallapop-cli"
Repository = "https://github.com/berendgort/wallapop-cli"
Issues = "https://github.com/berendgort/wallapop-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walla"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"walla/cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["walla"]
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live Wallapop (opt-in)"]
addopts = "--cov=walla --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "walla/mcp/*",
    "walla/cli/cmd_*.py",
    "walla/cli/main.py",
    "walla/cli/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
